services:
  # Zypheron API backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zypheron-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zypheron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zypheron_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zypheron}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-zypheron_redis_password}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - zypheron-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: zypheron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zypheron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zypheron_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zypheron}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zypheron} -d ${POSTGRES_DB:-zypheron}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zypheron-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: zypheron-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zypheron_redis_password}
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-zypheron_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
      --save 3600 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-zypheron_redis_password} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zypheron-network

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zypheron-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zypheron.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zypheron-network
    profiles:
      - tools

  # Test runner (run with: docker compose --profile test up test-runner)
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: zypheron-test-runner
    environment:
      DATABASE_TYPE: sqlite
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENVIRONMENT: development
      JWT_SECRET_KEY: test-secret-key-for-unit-tests-only-32chars
      REDIS_ENABLED: "false"
      ENABLE_RATE_LIMITING: "false"
    networks:
      - zypheron-network
    profiles:
      - test

  # Prometheus monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: zypheron-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - zypheron-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  zypheron-network:
    driver: bridge
