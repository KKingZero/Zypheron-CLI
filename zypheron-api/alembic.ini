[alembic]
# Path to migration scripts
script_location = alembic

# Ensure the project root is on sys.path so "app" package imports work
prepend_sys_path = .

# Template used to generate migration file names; defaults to %%(rev)s_%%(slug)s
# Using "os" separator ensures cross-platform compatibility
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
version_path_separator = os

# Database URL placeholder -- overridden at runtime by env.py from app settings.
# This value is only used if env.py fails to set it dynamically.
sqlalchemy.url = sqlite+aiosqlite:///./zypheron.db

[post_write_hooks]
# Uncomment the following to run ruff formatting after generating a migration:
# hooks = ruff_format
# ruff_format.type = exec
# ruff_format.executable = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
