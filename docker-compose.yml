version: '3.8'

services:
  # Frontend - React Application
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3001

  # Backend - Node.js API Server
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - osint
      - scanner
      - crawler
      - packet-manipulator
    environment:
      - DATABASE_URL=postgresql://cobraai:cobrapass@postgres:5432/cobraai
      - JWT_SECRET=your-secret-key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - NODE_ENV=production
      - OSINT_SERVICE_URL=osint:8001
      - SCANNER_SERVICE_URL=scanner:8002
      - PACKET_SERVICE_URL=packet-manipulator:8003
      - CRAWLER_SERVICE_URL=crawler:8004
      - VULN_SCANNER_SERVICE_URL=vulnerability-scanner:8005
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Python OSINT Service
  osint:
    build: ./backend/services/osint
    ports:
      - "8001:8001"
    environment:
      - OSINT_SERVICE_PORT=8001
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - HIBP_API_KEY=${HIBP_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; import grpc_health.v1.health_pb2_grpc"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Rust Scanner Service
  scanner:
    build: ./backend/services/scanner
    ports:
      - "8002:8002"
    environment:
      - SCANNER_SERVICE_PORT=8002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 nc -z localhost 8002"]
      interval: 30s
      timeout: 10s
      retries: 3

  # C++ Packet Manipulator Service
  packet-manipulator:
    build: ./backend/services/packet-manipulator
    ports:
      - "8003:8003"
    environment:
      - PACKET_SERVICE_PORT=8003
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 nc -z localhost 8003"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Go Web Crawler Service
  crawler:
    build: ./backend/services/crawler
    ports:
      - "8004:8004"
    environment:
      - CRAWLER_SERVICE_PORT=8004
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 nc -z localhost 8004"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Rust Vulnerability Scanner Service
  vulnerability-scanner:
    build: ./backend/services/vulnerability-scanner
    ports:
      - "8005:8005"
    environment:
      - VULN_SCANNER_SERVICE_PORT=8005
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 nc -z localhost 8005"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cobraai
      - POSTGRES_PASSWORD=cobrapass
      - POSTGRES_DB=cobraai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: 