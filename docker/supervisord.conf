[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:backend]
command=npm start
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
environment=NODE_ENV=production,PORT=3001

[program:osint]
command=python3 osint_service_grpc.py
directory=/app/backend/services/osint
autostart=true
autorestart=true
stderr_logfile=/var/log/osint.err.log
stdout_logfile=/var/log/osint.out.log
environment=OSINT_SERVICE_PORT=8001

[program:scanner]
command=./target/release/cobra-scanner
directory=/app/backend/services/scanner
autostart=true
autorestart=true
stderr_logfile=/var/log/scanner.err.log
stdout_logfile=/var/log/scanner.out.log
environment=SCANNER_SERVICE_PORT=8002

[program:crawler]
command=./crawler
directory=/app/backend/services/crawler
autostart=true
autorestart=true
stderr_logfile=/var/log/crawler.err.log
stdout_logfile=/var/log/crawler.out.log
environment=CRAWLER_SERVICE_PORT=8004

[program:packet]
command=./build/packet_service
directory=/app/backend/services/packet-manipulator
autostart=true
autorestart=true
stderr_logfile=/var/log/packet.err.log
stdout_logfile=/var/log/packet.out.log
environment=PACKET_SERVICE_PORT=8003

[program:vuln-scanner]
command=./target/release/vulnerability-scanner
directory=/app/backend/services/vulnerability-scanner
autostart=true
autorestart=true
stderr_logfile=/var/log/vuln-scanner.err.log
stdout_logfile=/var/log/vuln-scanner.out.log
environment=VULN_SCANNER_SERVICE_PORT=8005 