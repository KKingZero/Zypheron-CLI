services:
  # DeepSeek-R1 Local LLM (Latest Open Source Model)
  deepseek:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"     # Ollama API
    volumes:
      - deepseek_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # For GPU support (uncomment if you have NVIDIA GPU)
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  # DeepSeek-R1 Model Downloader (runs once to download latest open source model)
  deepseek-setup:
    image: ollama/ollama:latest
    depends_on:
      - deepseek
    volumes:
      - deepseek_data:/root/.ollama
    environment:
      - OLLAMA_HOST=deepseek:11434
    command: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 30 &&
        echo 'Downloading DeepSeek-R1 8B (Latest Open Source Model)...' &&
        ollama pull deepseek-r1:8b &&
        echo 'Downloading DeepSeek-R1 7B (Alternative Model)...' &&
        ollama pull deepseek-r1:7b &&
        echo 'DeepSeek-R1 models downloaded successfully!' &&
        echo 'Available models: deepseek-r1:8b (recommended), deepseek-r1:7b'
      "
    restart: "no"

  # DeepSeek Web UI (Optional)
  deepseek-ui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"       # Web UI
    depends_on:
      - deepseek
    environment:
      - OLLAMA_BASE_URL=http://deepseek:11434
      - WEBUI_SECRET_KEY=your-secret-key-here
      - DEFAULT_MODEL=deepseek-r1:8b
    volumes:
      - deepseek_ui_data:/app/backend/data
    restart: unless-stopped

volumes:
  deepseek_data:
  deepseek_ui_data: 