version: '3.8'

services:
  # Frontend - React Application  
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3001

  # Backend - Node.js API Server (Simplified)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.simple
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://cobraai:cobrapass@postgres:5432/cobraai
      - JWT_SECRET=your-secret-key-here
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cobraai
      - POSTGRES_PASSWORD=cobrapass
      - POSTGRES_DB=cobraai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: 