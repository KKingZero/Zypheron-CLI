version: '3.8'

services:
  # All-in-One COBRA AI Container
  cobra-ai:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    ports:
      - "80:80"           # Frontend
      - "3001:3001"       # Backend API
      - "8001:8001"       # OSINT Service
      - "8002:8002"       # Scanner Service
      - "8003:8003"       # Packet Service
      - "8004:8004"       # Crawler Service
      - "8005:8005"       # Vulnerability Scanner
    depends_on:
      - postgres
      - deepseek
    environment:
      - DATABASE_URL=postgresql://cobraai:cobrapass@postgres:5432/cobraai
      - JWT_SECRET=your-secret-key-here
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - DEEPSEEK_API_URL=http://deepseek:11434
      - NODE_ENV=production
      # OSINT API Keys
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - HIBP_API_KEY=${HIBP_API_KEY}
    restart: unless-stopped

  # DeepSeek Local LLM
  deepseek:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"     # Ollama API
    volumes:
      - deepseek_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # For GPU support (uncomment if you have NVIDIA GPU)
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  # DeepSeek Model Downloader (runs once to download model)
  deepseek-setup:
    image: ollama/ollama:latest
    depends_on:
      - deepseek
    volumes:
      - deepseek_data:/root/.ollama
    environment:
      - OLLAMA_HOST=deepseek:11434
    command: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 30 &&
        echo 'Downloading DeepSeek-R1 8B (Latest Open Source Model)...' &&
        ollama pull deepseek-r1:8b &&
        echo 'Downloading DeepSeek-R1 7B (Alternative Model)...' &&
        ollama pull deepseek-r1:7b &&
        echo 'DeepSeek-R1 models downloaded successfully!' &&
        echo 'Available models: deepseek-r1:8b (recommended), deepseek-r1:7b'
      "
    restart: "no"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cobraai
      - POSTGRES_PASSWORD=cobrapass
      - POSTGRES_DB=cobraai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # DeepSeek Web UI (Optional)
  deepseek-ui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"       # Web UI
    depends_on:
      - deepseek
    environment:
      - OLLAMA_BASE_URL=http://deepseek:11434
      - WEBUI_SECRET_KEY=your-secret-key-here
      - DEFAULT_MODEL=deepseek-r1:8b
    volumes:
      - deepseek_ui_data:/app/backend/data
    restart: unless-stopped

volumes:
  postgres_data:
  deepseek_data:
  deepseek_ui_data: 