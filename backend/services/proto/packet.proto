syntax = "proto3";

package cobra.packet;

import "common.proto";

option go_package = "github.com/cobra-ai/proto/packet";

service PacketManipulator {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc CraftPacket(CraftPacketRequest) returns (CraftPacketResponse);
  rpc AnalyzePacket(AnalyzePacketRequest) returns (AnalyzePacketResponse);
  rpc SendPacket(SendPacketRequest) returns (SendPacketResponse);
  rpc CapturePackets(CapturePacketsRequest) returns (stream PacketInfo);
}

// Packet types
enum PacketType {
  UNKNOWN = 0;
  TCP = 1;
  UDP = 2;
  ICMP = 3;
  ARP = 4;
  DNS = 5;
  HTTP = 6;
  HTTPS = 7;
  CUSTOM = 8;
}

// Craft packet request
message CraftPacketRequest {
  PacketType type = 1;
  Target source = 2;
  Target destination = 3;
  map<string, string> headers = 4;
  bytes payload = 5;
  PacketOptions options = 6;
}

message PacketOptions {
  bool fragmentation = 1;
  int32 ttl = 2;
  bool dont_fragment = 3;
  int32 window_size = 4;
  repeated string tcp_flags = 5;  // SYN, ACK, FIN, RST, PSH, URG
}

message CraftPacketResponse {
  Status status = 1;
  bytes packet_data = 2;
  int32 packet_size = 3;
  string packet_hex = 4;
}

// Analyze packet request
message AnalyzePacketRequest {
  bytes packet_data = 1;
}

message AnalyzePacketResponse {
  Status status = 1;
  PacketInfo info = 2;
}

message PacketInfo {
  PacketType type = 1;
  Target source = 2;
  Target destination = 3;
  map<string, string> headers = 4;
  bytes payload = 5;
  int32 size = 6;
  Timestamp captured_at = 7;
  repeated string flags = 8;
  map<string, string> metadata = 9;
}

// Send packet request
message SendPacketRequest {
  bytes packet_data = 1;
  string interface = 2;
  int32 count = 3;
  int32 interval_ms = 4;
}

message SendPacketResponse {
  Status status = 1;
  int32 packets_sent = 2;
  repeated string errors = 3;
}

// Capture packets request
message CapturePacketsRequest {
  string interface = 1;
  string filter = 2;  // BPF filter
  int32 max_packets = 3;
  int32 timeout_seconds = 4;
} 