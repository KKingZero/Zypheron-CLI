syntax = "proto3";

package cobra;

option go_package = "github.com/cobra-ai/proto/common";

// Common status message
message Status {
  bool success = 1;
  string message = 2;
  int32 code = 3;
}

// Health check
message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string service_name = 2;
  string version = 3;
  int64 uptime_seconds = 4;
}

// Common target information
message Target {
  string hostname = 1;
  string ip_address = 2;
  int32 port = 3;
}

// Timestamp
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
} 