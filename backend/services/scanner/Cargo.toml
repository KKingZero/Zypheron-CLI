[package]
name = "cobra-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
futures = "0.3"
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
socket2 = "0.5"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3 